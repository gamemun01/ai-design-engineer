name: CI

on:
  push:
    branches: [main, dev/**, feature/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:md

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run validate-skill
      - run: npm run check-links

  test-skills:
    name: Skill & Example Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Contract checks (cross-refs, pitfalls/checklist counts, example
      # completeness, REVIEW score >= gate) + golden snapshot drift detection.
      - run: npm run test:skills

  test-plugins:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Validate all community plugins (manifest + v2.1.0 skills) and check the
      # registry + golden snapshot for drift.
      - run: npm run validate-plugin
      - run: npm run test:plugins

  docs-build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material
      - name: Build
        run: |
          cd docs-site
          mkdocs build --strict
