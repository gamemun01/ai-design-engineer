name: CI

on:
  push:
    branches: [main, dev/**, feature/**]
  pull_request:
    branches: [main]

jobs:
  studio:
    name: Studio build and HTTP contracts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.22.0"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix apps/studio --ignore-scripts
      - run: npm run studio:test
      - run: npm run studio:package
      - run: node scripts/verify-studio-package.mjs
      - run: npm audit --audit-level=low
      - run: npm audit --prefix apps/studio --audit-level=low

  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint:md

  validate-skills:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run validate-skill
      - run: npm run skills:codex:check
      - run: npm run check-links

  test-skills:
    name: Skill & Example Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Contract checks (cross-refs, pitfalls/checklist counts, example
      # completeness, REVIEW score >= gate) + golden snapshot drift detection.
      - run: npm run test:skills

  test-plugins:
    name: Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      # Validate all community plugins (manifest + v2.1.0 skills) and check the
      # registry + golden snapshot for drift.
      - run: npm run validate-plugin
      - run: npm run test:plugins

  docs-build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material
      - name: Build
        run: |
          cd docs-site
          mkdocs build --strict
